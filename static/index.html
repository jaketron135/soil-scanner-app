<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Diagnostic Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover {
            background-color: #219150;
        }
        .input-group {
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌱 Soil Diagnostic Tool</h2>
        <form action="/predict" method="post" enctype="multipart/form-data">
            <div class="input-group">
                <label for="file-upload" class="btn" style="background-color: #3498db; margin-bottom: 10px; display: inline-block;">
                    📷 Take Photo / Choose File
                </label>
                <input id="file-upload" type="file" name="file" accept="image/*" capture="environment" required style="display: block; margin: 10px auto;">
            </div>
            <div style="text-align: center;">
                <button type="submit" class="btn">Analyze Soil</button>
            </div>
        </form>

        <hr style="margin: 30px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📜 Recent Scan Logs</h3>
            <a href="/export-csv" download class="btn" style="background-color: #2c3e50; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 0.9rem;">
                📥 Export CSV
            </a>
        </div>
    </div>
</body>
</html>
