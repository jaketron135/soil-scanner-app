<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Diagnostic Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
        }
        .btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn-upload {
            background-color: #3498db;
        }
        .btn-upload:hover {
            background-color: #2980b9;
        }
        .btn:hover {
            background-color: #219150;
        }
        .input-container {
            text-align: center;
            margin: 20px 0;
        }
        #file-input {
            display: none;
        }
        #file-name {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌱 Soil Diagnostic Tool</h2>
        
        <form action="/predict" method="post" enctype="multipart/form-data">
            <div class="input-container">
                <!-- Custom button linked to file input -->
                <label for="file-input" class="btn btn-upload">
                    📷 Take Photo / Choose File
                </label>
                <input id="file-input" type="file" name="file" accept="image/*" capture="environment" required onchange="showFileName(this)">
                <div id="file-name">No photo selected</div>
            </div>

            <div style="text-align: center;">
                <button type="submit" class="btn">Analyze Soil</button>
            </div>
        </form>

        <hr style="margin: 30px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>📜 Recent Scan Logs</h3>
            <a href="/export-csv" download class="btn" style="background-color: #2c3e50; padding: 8px 12px; font-size: 0.9rem;">
                📥 Export CSV
            </a>
        </div>
    </div>

    <script>
        function showFileName(input) {
            const fileNameDiv = document.getElementById('file-name');
            if (input.files && input.files[0]) {
                fileNameDiv.textContent = "Selected: " + input.files[0].name;
                fileNameDiv.style.color = "#27ae60";
            } else {
                fileNameDiv.textContent = "No photo selected";
                fileNameDiv.style.color = "#7f8c8d";
            }
        }
    </script>
</body>
</html>
