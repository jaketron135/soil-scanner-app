<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Diagnostic Scanner</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --accent: #e8f5e9;
            --text: #2c3e50;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 16px;
            color: var(--text);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--primary-dark);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 4px;
        }

        .upload-section {
            border: 2px dashed #a5d6a7;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background-color: var(--accent);
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            text-align: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: #455a64;
            margin-top: 12px;
        }

        .btn-reset {
            background-color: #78909c;
            margin-top: 16px;
        }

        .btn:disabled {
            background-color: #c8e6c9;
            color: #81c784;
            cursor: not-allowed;
        }

        #preview {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 16px;
            display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .spinner-container {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-card, .history-card {
            margin-top: 20px;
            padding: 18px;
            border-radius: 12px;
            background-color: #fafafa;
            border: 1px solid #eee;
            display: none;
        }

        .results-card h3, .history-card h3 {
            margin-top: 0;
            color: var(--primary-dark);
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
            font-size: 1.1rem;
        }

        .metric-group {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            font-size: 0.9rem;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #e0e0e0;
            color: #333;
        }

        .badge-success { background-color: #c8e6c9; color: #1b5e20; }
        .badge-warning { background-color: #fff9c4; color: #f57f17; }
        .badge-info { background-color: #e1f5fe; color: #0277bd; }

        .advice-box {
            background-color: #f1f8e9;
            border-left: 4px solid var(--primary);
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 12px;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .crop-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .crop-tag {
            background-color: var(--accent);
            color: var(--primary-dark);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .tech-footer {
            font-size: 0.78rem;
            color: #888;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Soil Diagnostic Scanner</h1>
            <p>Computer Vision Soil Analysis & Crop Advisor</p>
        </div>
        
        <div class="upload-section">
            <label for="soilImage" class="btn">📷 Capture / Select Soil</label>
            <input type="file" id="soilImage" accept="image/*" capture="environment">
            <img id="preview" alt="Soil Sample Preview">
        </div>

        <button id="analyzeBtn" class="btn" onclick="uploadAndAnalyze()" disabled>🔬 Run Diagnostic Scan</button>
        
        <div id="loading" class="spinner-container">
            <div class="spinner"></div>
            <span style="font-size: 0.9rem; color: #555;">Analyzing edge density & color spectrum...</span>
        </div>

        <div id="resultsCard" class="results-card">
            <h3>Diagnostic Report</h3>
            
            <div class="metric-group">
                <span class="metric-label">Soil Classification:</span>
                <span id="resType" class="badge badge-success"></span>
            </div>
            
            <div class="metric-group">
                <span class="metric-label">Topography Texture:</span>
                <span id="resTopo" style="font-size: 0.88rem; font-weight: 600;"></span>
            </div>

            <div class="metric-group">
                <span class="metric-label">Moisture Level:</span>
                <span id="resMoist" class="badge badge-info"></span>
            </div>

            <div class="advice-box">
                <strong>Soil Health & Nutrients:</strong>
                <div id="resNutr" style="margin-top: 4px;"></div>
            </div>

            <div style="margin-top: 12px;">
                <span class="metric-label">Recommended Crops:</span>
                <div id="resCrops" class="crop-container"></div>
            </div>

            <div class="tech-footer">
                Canny Edge Density: <span id="resEdge"></span> | HSV Brightness: <span id="resBright"></span>
            </div>

            <button class="btn btn-reset" onclick="resetForm()">🔄 Scan Another Sample</button>
        </div>

        <button class="btn btn-secondary" onclick="fetchHistory()">📜 Recent Scan Logs</button>

        <div id="historyCard" class="history-card">
            <h3>Scan History</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('soilImage');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const resultsCard = document.getElementById('resultsCard');
        const historyCard = document.getElementById('historyCard');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    analyzeBtn.disabled = false;
                };
                reader.readAsDataURL(file);
            }
        });

        async function uploadAndAnalyze() {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            resultsCard.style.display = 'none';

            try {
                const response = await fetch('/api/v1/diagnose', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('resType').innerText = data.soil_type;
                    document.getElementById('resTopo').innerText = data.topography;
                    document.getElementById('resMoist').innerText = data.moisture;
                    document.getElementById('resNutr').innerText = data.nutrients;
                    document.getElementById('resEdge').innerText = data.cv_metrics.edge_density;
                    document.getElementById('resBright').innerText = data.cv_metrics.avg_brightness;

                    const cropContainer = document.getElementById('resCrops');
                    cropContainer.innerHTML = '';
                    data.crops.forEach(crop => {
                        const tag = document.createElement('span');
                        tag.className = 'crop-tag';
                        tag.innerText = crop;
                        cropContainer.appendChild(tag);
                    });

                    resultsCard.style.display = 'block';
                }
            } catch (err) {
                alert('Analysis failed: ' + err);
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }

        function resetForm() {
            fileInput.value = '';
            preview.style.display = 'none';
            resultsCard.style.display = 'none';
            analyzeBtn.disabled = true;
        }

        async function fetchHistory() {
            try {
                const response = await fetch('/api/v1/history');
                const data = await response.json();
                
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = '';

                data.history.forEach(item => {
                    const entry = document.createElement('div');
                    entry.style.padding = '8px 0';
                    entry.style.borderBottom = '1px solid #eee';
                    entry.style.fontSize = '0.88rem';
                    entry.innerHTML = `<strong>${item.timestamp}</strong><br>${item.soil_type} - <em>${item.moisture}</em>`;
                    historyList.appendChild(entry);
                });

                historyCard.style.display = historyCard.style.display === 'block' ? 'none' : 'block';
            } catch (err) {
                alert('Failed to load history: ' + err);
            }
        }
    </script>
</body>
</html>
